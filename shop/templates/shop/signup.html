{% extends 'base.html' %}
{% block title %}
Sign Up Page
{% endblock title %}

{% block main %}
<div class="container">
  <form action="{% url 'signup' %}"
          method="post"
          enctype="multipart/form-data"
          class="col-5 mx-auto d-flex flex-column">
    <h3 class="text-center">SIGN UP</h3>
    {% csrf_token %}
    {{form.as_p}}
    <button class="btn btn-warning" type="submit">Sign up</button>
  </form>
</div>
{% endblock main %}
